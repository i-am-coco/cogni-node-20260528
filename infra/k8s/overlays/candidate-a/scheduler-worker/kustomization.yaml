apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cogni-candidate-a

resources:
  - ../../../base/scheduler-worker

# Image tag — updated by argocd-image-updater (or candidate-a flight).
images:
  - name: ghcr.io/cogni-dao/cogni-node-template
    newName: ghcr.io/cogni-dao/cogni-node-template
    newTag: "pr-46-d638ff639532c6876a57af3338a8086793e2203f-scheduler-worker"

patches:
  - target:
      kind: ConfigMap
      name: scheduler-worker-config
    patch: |
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-candidate-a"
      - op: replace
        path: /data/IMAGE_DIGEST
        value: "candidate-a-placeholder-scheduler-worker"
      - op: replace
        path: /data/COGNI_NODE_ENDPOINTS
        value: "operator=http://node-app:3000,node-template=http://node-app:3000,4ff8eac1-4eba-4ed0-931b-b1fe4f64713d=http://node-app:3000"

  # bug.0295: VM discovery via DNS (candidate-a.cogni-node-20260528-candidate-a.vm.opencompany.cc).
  # Convert base headless Services → ExternalName; delete EndpointSlices.
  - target: { kind: Service, name: temporal }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: temporal
      spec:
        type: ExternalName
        externalName: candidate-a.cogni-node-20260528-candidate-a.vm.opencompany.cc
        clusterIP: null
  - target: { kind: Service, name: postgres }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres
      spec:
        type: ExternalName
        externalName: candidate-a.cogni-node-20260528-candidate-a.vm.opencompany.cc
        clusterIP: null
  - target: { kind: Service, name: app }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: app
      spec:
        type: ExternalName
        externalName: candidate-a.cogni-node-20260528-candidate-a.vm.opencompany.cc
        clusterIP: null
  - target: { kind: EndpointSlice, name: temporal-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: temporal-1
  - target: { kind: EndpointSlice, name: postgres-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: postgres-1
  - target: { kind: EndpointSlice, name: app-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: app-1
